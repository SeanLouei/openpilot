# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is
        engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: Enable this to enforce sunnypilot to steer with Torque lateral control.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LateralJerkTorqueController
      widget: toggle
      title: Lateral Jerk Torque Controller
      description: Looks ahead at planned steering to reduce sudden corrections, so the wheel moves more smoothly through turns. Works with Self-Tune and custom tuning. Thanks to @twilsonco for the implementation.
      visibility:
      - type: not
        condition:
          type: capability
          field: steer_control_type
          equals: angle
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: NeuralNetworkLateralControl
        equals: false
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: Enables self-tune for Torque lateral control for platforms that do not use Torque lateral control by default.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: Less strict settings when using Self-Tune. This allows torqued to be more forgiving when learning values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: Enables custom tuning for Torque lateral control. Modifying Lateral Acceleration Factor and Friction below
        will override the offline values indicated in the YAML files within "opendbc/car/torque_data". The values will also
        be used live when "Manual Real-Time Tuning" toggle is enabled.
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: Enforces the torque lateral controller to use the fixed values instead of the learned values from Self-Tune.
        Enabling this toggle overrides Self-Tune values.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the version of Torque Control Tune to use.
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: RoadEdgeLaneChangeEnabled
    widget: toggle
    title: 'Block Lane Change: Road Edge Detection'
    description: Blocks lane change when the model sees a road edge on the side you signal.
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot.
    enablement:
    - type: capability
      field: has_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
- id: navigation
  title: Navigation
  description: Turn and exit desires confirmed against the navigation route, once Navigation (Alpha) is on in Developer
  items:
  - key: NavTurnDesire
    widget: toggle
    title: Navigation Turn Desires
    description: With a route, signal for its next turn about 8 seconds ahead; on roads faster than about 45 mph (70 km/h),
      first move into the lane you will turn from, then signal about 15 seconds ahead, so the car can slow down in time.
      Farther out than about 250 m (800 ft), the blinker counts as the turn signal only once the model has seen the car in the
      outermost lane on the turn's side; above about 55 mph (90 km/h), if Slowing for Route Turn does not show soon after you
      signal, slow the car yourself (lower the set speed, or brake), or the turn is skipped. About 3 seconds before the car
      starts steering into the turn, it plans the turn, but only if it can still get down to turning speed by then. With openpilot longitudinal (alpha), which slows the car for the turn, it must
      be below 20 mph (32 km/h) and able to slow down in time, counting the speed it still gains while openpilot is speeding
      it up, so signal before you pull away. Route turns never start while the car's own cruise control is on. A turn that has
      not started by about 8 m (25 ft) before the corner, or that the car is too fast for, is skipped, and the car goes
      straight. From about 20 seconds before the turn, a blinker toward it never starts an automatic lane change, and a nudge
      changes lanes only above 20 mph, which the slowdown takes the car below about 50 m (165 ft) before the turn, so move into
      a turn lane before you signal.
    details: |-
      To call a turn off, switch the blinker off, or over to the other side, before it starts; with Automatic Route Turns on, switching it off also means the car will not take that turn by itself, though it still slows for it. The gas only ends its slowdown: the car speeds up again, which usually means no turn, but if it is still slow enough and no longer speeding up, the turn starts anyway. Keep the blinker on until the turn starts: if it goes off before then, also by itself after a short signal, the turn ends, and so does its slowdown unless the car is already within about 15 m (50 ft) of the turn, so signal again. A turn that does not start leaves the car at turning speed to about 20 m (65 ft) past the corner: the gas or the other blinker before the corner ends that, and past it the gas overrides it only while pressed. Slowing for Route Turn does not by itself mean the turn will start. At a red light a started turn is repeated while the car waits short of the intersection, but a GPS error can still end that early, so be ready to steer when you go. Without openpilot longitudinal, route turns start only with the cruise control off, while you drive the speed yourself, below about 12 mph (20 km/h) for a right turn or 15 mph (24 km/h) for a left turn (the other way round where traffic keeps left): Tesla's cruise control speeds back up toward its set speed of 18 mph or more once the car ahead moves on, which would take the turn far too fast. Brake whenever you need to: on a Tesla that also turns steering off. A started turn keeps its slowdown through a gap in the GPS, by the distance driven, but its turn desire is not repeated without a fix, so after a stop of more than a few seconds be ready to steer; one that has not started waits for the fix. Leaving the route's road, onto a road that branches off for example, ends the route's next turn until the route is recalculated, but a road that leaves at a very shallow angle, or within about 40 m (130 ft) of the turn, can still get it. The model chooses the opening to turn into, so stay ready to steer.
    enablement:
    - type: param
      key: NavigationEnabled
      equals: true
  - key: NavAutoTurn
    widget: toggle
    title: Automatic Route Turns (Alpha)
    description: Slows for each route turn, and turns right on its own (left where traffic keeps left) once slowed down and in the
      curb lane for a second, counted again after a lane change. Needs openpilot longitudinal (alpha). Turns across oncoming
      traffic wait for your blinker unless Automatic Left Turns is on; turns where the model cannot see the curb lane slow
      and wait for your blinker. Before an automatic turn starts, the gas pedal, the opposite blinker or disengaging calls it
      off until you signal for it. Switching off a blinker you had on for the turn, or a short signal that stops by itself,
      calls off that turn, and the car will not take it by itself either (it still slows for it), unless the car switched
      the blinker off itself as an openpilot lane change ended. Once a turn starts, steer to stop it (on a Tesla the brake
      also stops it, since it turns steering off).
    details: |-
      Turning without signaling is illegal in most places and gives pedestrians and other drivers no warning: signal yourself where you can. The curb-lane check cannot see a bike lane behind a curb or posts, and may take a narrow painted bike lane for the curb lane, so before every automatic turn, check for cyclists on the side you are turning to, or signal. The car does not watch for pedestrians, cyclists or cross traffic, and does not reliably stop for red lights or stop signs, so watch every turn and be ready to take over.
    enablement:
    - type: param
      key: NavigationEnabled
      equals: true
  - key: NavAutoTurnFarSide
    widget: toggle
    title: Automatic Left Turns (Alpha)
    description: Needs Automatic Route Turns. Also turns left on its own (right where traffic keeps left), across oncoming
      traffic, but only from the lane right beside a raised median or curb on that side, such as a curbed left-turn bay or
      the left lane of a one-way street, and only where the posted speed limit is known and 45 mph (72 km/h) or less. The
      model must have seen that curb right beside the car for the last 10 m (33 ft) and 1.5 seconds, with no lane change and
      no car in that blind spot, and the route's lane guidance must not put the turn in another lane. The turn starts only
      while the car is moving, at least 2 seconds before it steers across, and Turning Across Traffic chimes as it starts.
      Everywhere else it slows and waits for your blinker, and shows Signal for Route Turn. Change it while parked (on the
      comma 4 you can also switch it off while driving); with Automatic Route Turns switched on while driving, it waits until
      the car next stands still.
    details: |-
      Turning Across Traffic chimes, with its own sound, at least 2 seconds before the car steers across oncoming traffic. The car does not see oncoming traffic, turn arrows, red lights or stop signs, and does not judge gaps: watch every automatic left turn and brake for oncoming traffic. On a Tesla, braking turns steering off as well as speed control, so finish the turn yourself. If the car stops within about 30 m (100 ft) of the turn before it starts, at a light, a stop sign or in a queue, the turn is left to you: the car keeps slowing for it, shows Signal for Route Turn, and turns once you signal. After the turn started, it is not repeated while the car waits or creeps, while driver monitoring warns, or in the last 2 seconds before the car steers across, and about 5 seconds after it started (or was last repeated) it is handed back to you, also if the car moves again by then: Turning Across Traffic goes away, and Signal for Route Turn shows while your blinker can still start it again. Without the blinker, a turn it refuses or hands back means the car drives straight through the intersection at about 10 mph (16 km/h), also out of a left-turn-only lane, so signal or take over when Signal for Route Turn shows. It shows from about 5 seconds before the car would steer into the turn, or as soon as the turn can no longer start by itself after that (half a second after a lane change into the bay ends, when the curb cannot be seen long enough before the turn), and once it has shown, that turn waits for your blinker; signal as soon as it shows, as a later blinker starts the turn later, and too late not at all. Painted turn lanes, center turn lanes and two-way streets have no curb beside the turn lane, so there the turn needs your blinker. The posted limit must be known, from map data or the car (where the car reads a higher limit than the map, the higher one counts), over the last 150 m (500 ft) before the turn, and driver monitoring must not be warning; its warnings show over these alerts. Quiet Mode silences their chimes. On the approach, switching off a left blinker you had on for the turn, pressing the gas, or switching on the right blinker means no automatic left turn at that intersection; the car switching the blinker off by itself as an openpilot lane change into a turn bay ends still lets the turn start by itself once the curb has been beside the car for 10 m. Frontage roads, channelized islands, curbed bus lanes and median U-turn openings can look like a turn lane to the curb check, and on one-way streets cyclists may ride on the left: watch for them. Turning without signaling is illegal in most places: signal yourself where you can. This setting is not restored from a sunnylink backup. Changing the driving model can change how curbs are seen.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: NavigationEnabled
      equals: true
    - type: param
      key: NavAutoTurn
      equals: true
  - key: NavAutoTurnLane
    widget: toggle
    title: Automatic Turn Lanes (Alpha)
    description: Needs Automatic Route Turns, and Automatic Left Turns for turns across oncoming traffic. From the outermost
      lane on the turn's side, once the model has seen the car there (the curb lane for a right turn; for a left turn, the
      lane right beside a raised median), the car moves by itself into a turn lane that opens beside it before a route turn,
      then turns from it. Moving to Turn Lane chimes and shows while it moves. It moves without the blinker, which is illegal
      in most places, so signal yourself where you can. Change it while parked (on the comma 4 you can also switch it off
      while driving).
    details: |-
      It moves once per turn, toward the turn only, into a lane the model sees open beside the car: at least 2.6 m (8.5 ft) wide, with a lane line between, no lane line beyond it, and still open 30 m (100 ft) ahead. It moves only between about 6 and 33 mph (9-54 km/h), within 150 m (490 ft) of the turn, and only where the move can end well before the turn starts, so the turn lane must be open by about 70 m (230 ft) before the turn at 20 mph, 80 m (260 ft) at 25-30 mph; a later one, and the car stays in its lane: no automatic right turn from there, and for a left turn Signal for Route Turn shows. It does not move with a blinker on, with a car in that blind spot, while Block Lane Change: Road Edge Detection blocks that side, with Auto Lane Change by Blinker set to Off, or where the route's lane guidance puts the turn in another lane; for a left turn there must be lane guidance, and everything Automatic Left Turns needs. Never on two-way roads or into painted left-turn bays (no curb beside the car), nor into short bays. The model can still take a bike lane, a parking lane, a bus bay or a turn lane for an earlier street for a turn lane: watch every move. To stop it, steer against it, switch on either blinker, or press the gas; on a Tesla, braking turns steering off. A car coming up in that blind spot stops it only before the car starts moving over. Once in the turn lane, the car turns from it as from the curb lane, while the model still sees it there. Its thresholds were set without real drives: use it first on quiet streets, with full attention. This setting is not restored from a sunnylink backup.
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: NavigationEnabled
      equals: true
    - type: param
      key: NavAutoTurn
      equals: true
  - key: NavExitDesire
    widget: toggle
    title: Navigation Exit Desires (Alpha)
    description: Near a route exit or fork with lane guidance, a light steering nudge toward it has the car keep to that side of
      the split. Above 20 mph with your blinker on, a nudge changes lanes instead.
    enablement:
    - type: param
      key: NavigationEnabled
      equals: true
